# pyproject.toml : package metadata, dependencies, CLI entry point, pytest config.
# Runtime deps are kept small so the backend fits on Render free (512 MB RAM): fastembed instead of torch.

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "forgeai"
version = "0.1.0"
description = "ForgeAI: brief + documents in, tested agent out"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "python-multipart>=0.0.9",
    "httpx>=0.27",
    "typer>=0.12",
    "rich>=13.7",
    "pymupdf>=1.24",
    "python-docx>=1.1",
    "pandas>=2.2",
    "openpyxl>=3.1",
    "rank-bm25>=0.2.2",
    "fastembed>=0.3",
    "numpy>=1.26",
    "rapidfuzz>=3.6",
    "pyyaml>=6.0",
    "jinja2>=3.1",
    "tenacity>=8.2",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "ruff>=0.4", "fpdf2>=2.7"]
local = ["sentence-transformers>=2.7"]

[project.scripts]
forge = "forge.cli:app"

[tool.setuptools.packages.find]
include = ["forge*", "app*"]

[tool.pytest.ini_options]
markers = ["slow: calls a real LLM"]
testpaths = ["tests"]

[tool.ruff]
line-length = 110
